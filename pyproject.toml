[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "it-dunyosi-bot"
version = "0.1.0"
description = "IT Dunyosi Telegram kanali uchun AI administrator-bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31",
    "apscheduler>=3.10,<4",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "httpx>=0.27",
    "tenacity>=8.2",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "rapidfuzz>=3.9",
    "pillow>=10.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "loguru>=0.7",
    "openai>=1.40",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
gemini = ["google-genai>=1.0"]
all = ["anthropic>=0.40", "google-genai>=1.0"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "fonttools>=4.50",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["ai/prompts/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "RUF012", "ASYNC109", "UP046", "UP047"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
packages = ["app"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
